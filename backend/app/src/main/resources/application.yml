server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: effective-office

  profiles:
    include:
      - repository

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  packages-to-scan: band.effective.office.backend.app.controller, band.effective.office.backend.feature.authorization.controller, band.effective.office.backend.feature.booking.core.controller

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Calendar provider configuration
calendar:
  provider: google # Options: google, dummy
  default-calendar: ${DEFAULT_CALENDAR} # Default calendar ID, can be overridden with DEFAULT_CALENDAR environment variable
  application-name: ${CALENDAR_APPLICATION_NAME} # Application name for Google Calendar API
  delegated-user: ${CALENDAR_DELEGATED_USER} # Email of the user to impersonate (optional)
  credentials.file: ${GOOGLE_CREDENTIALS_FILE:google-credentials.json}